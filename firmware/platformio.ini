; PlatformIO Project Configuration File for kreier/wifi
; Version: 1.1.9
; https://github.com/kreier/wifi
;
; Unified ESP32 and ESP32-C3 Super Mini targets:
; Hardware targets (T18, T8, DevKit V1, C3 Super Mini, Custom) are configured at runtime via NVS.
; Dual OTA support with 1.9MB application slots and 190KB raw offline data partition.

[platformio]
default_envs = esp32dev, esp32c3, esp32s3, esp32c5
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FIRMWARE_VERSION=\"1.1.9\"

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = partitions/min_spiffs.csv

lib_ignore =
    BluetoothSerial

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FIRMWARE_VERSION=\"1.1.9\"
    -D TARGET_C3_SUPERMINI=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/min_spiffs.csv

lib_ignore =
    BluetoothSerial

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FIRMWARE_VERSION=\"1.1.9\"
    -D TARGET_ESP32S3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c5]
platform = espressif32
board = esp32-c5-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = partitions/min_spiffs.csv

lib_ignore =
    BluetoothSerial

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FIRMWARE_VERSION=\"1.1.9\"
    -D TARGET_ESP32C5=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
