name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. v1.1.8)"
        required: true
        default: "v1.1.8"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install --upgrade platformio

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building firmware for version tag: ${TAG}"

      - name: Build Unified ESP32 Firmware (ESP32, ESP32-C3, ESP32-S3, ESP32-C5)
        run: |
          cd firmware
          pio run -e esp32dev | tee ../pio_build_esp32.log
          pio run -e esp32c3 | tee ../pio_build_esp32c3.log
          pio run -e esp32s3 | tee ../pio_build_esp32s3.log
          pio run -e esp32c5 | tee ../pio_build_esp32c5.log
          cd ..

      - name: Stage Artifacts & Compute Checksums
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p release_assets
          cp firmware/.pio/build/esp32dev/firmware.bin release_assets/firmware-esp32-${TAG}.bin
          cp firmware/.pio/build/esp32dev/partitions.bin release_assets/partitions-esp32-${TAG}.bin
          cp firmware/.pio/build/esp32dev/bootloader.bin release_assets/bootloader-esp32-${TAG}.bin
          
          cp firmware/.pio/build/esp32c3/firmware.bin release_assets/firmware-esp32c3-${TAG}.bin
          cp firmware/.pio/build/esp32c3/partitions.bin release_assets/partitions-esp32c3-${TAG}.bin
          cp firmware/.pio/build/esp32c3/bootloader.bin release_assets/bootloader-esp32c3-${TAG}.bin

          cp firmware/.pio/build/esp32s3/firmware.bin release_assets/firmware-esp32s3-${TAG}.bin
          cp firmware/.pio/build/esp32s3/partitions.bin release_assets/partitions-esp32s3-${TAG}.bin
          cp firmware/.pio/build/esp32s3/bootloader.bin release_assets/bootloader-esp32s3-${TAG}.bin

          cp firmware/.pio/build/esp32c5/firmware.bin release_assets/firmware-esp32c5-${TAG}.bin
          cp firmware/.pio/build/esp32c5/partitions.bin release_assets/partitions-esp32c5-${TAG}.bin
          cp firmware/.pio/build/esp32c5/bootloader.bin release_assets/bootloader-esp32c5-${TAG}.bin
          
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" 2>/dev/null | head -n 1)
          if [ -n "$BOOT_APP0" ] && [ -f "$BOOT_APP0" ]; then
            cp "$BOOT_APP0" release_assets/boot_app0.bin
          fi

          python3 -c "
          import os
          tag = '${TAG}'
          ba = open('release_assets/boot_app0.bin', 'rb').read() if os.path.exists('release_assets/boot_app0.bin') else b''

          targets = [
              ('esp32', 0x1000),
              ('esp32c3', 0x0),
              ('esp32s3', 0x0),
              ('esp32c5', 0x0)
          ]

          for name, bl_offset in targets:
              fw = open(f'release_assets/firmware-{name}-{tag}.bin', 'rb').read()
              pt = open(f'release_assets/partitions-{name}-{tag}.bin', 'rb').read()
              bl = open(f'release_assets/bootloader-{name}-{tag}.bin', 'rb').read()

              buf = bytearray([0xFF] * (0x10000 + len(fw)))
              buf[bl_offset:bl_offset+len(bl)] = bl
              buf[0x8000:0x8000+len(pt)] = pt
              if ba:
                  buf[0xe000:0xe000+len(ba)] = ba
              buf[0x10000:0x10000+len(fw)] = fw
              open(f'release_assets/firmware-{name}-merged-{tag}.bin', 'wb').write(buf)
          "

          python3 scripts/generate-release-notes.py "${TAG}"

          cd release_assets
          sha256sum firmware-esp32-${TAG}.bin > checksums.txt
          sha256sum partitions-esp32-${TAG}.bin >> checksums.txt
          sha256sum bootloader-esp32-${TAG}.bin >> checksums.txt
          sha256sum firmware-esp32-merged-${TAG}.bin >> checksums.txt

          sha256sum firmware-esp32c3-${TAG}.bin >> checksums.txt
          sha256sum partitions-esp32c3-${TAG}.bin >> checksums.txt
          sha256sum bootloader-esp32c3-${TAG}.bin >> checksums.txt
          sha256sum firmware-esp32c3-merged-${TAG}.bin >> checksums.txt

          sha256sum firmware-esp32s3-${TAG}.bin >> checksums.txt
          sha256sum partitions-esp32s3-${TAG}.bin >> checksums.txt
          sha256sum bootloader-esp32s3-${TAG}.bin >> checksums.txt
          sha256sum firmware-esp32s3-merged-${TAG}.bin >> checksums.txt

          sha256sum firmware-esp32c5-${TAG}.bin >> checksums.txt
          sha256sum partitions-esp32c5-${TAG}.bin >> checksums.txt
          sha256sum bootloader-esp32c5-${TAG}.bin >> checksums.txt
          sha256sum firmware-esp32c5-merged-${TAG}.bin >> checksums.txt

          if [ -f boot_app0.bin ]; then sha256sum boot_app0.bin >> checksums.txt; fi
          cat checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          body_path: release_body.md
          files: |
            release_assets/firmware-esp32-${{ steps.vars.outputs.tag }}.bin
            release_assets/partitions-esp32-${{ steps.vars.outputs.tag }}.bin
            release_assets/bootloader-esp32-${{ steps.vars.outputs.tag }}.bin
            release_assets/firmware-esp32-merged-${{ steps.vars.outputs.tag }}.bin
            release_assets/firmware-esp32c3-${{ steps.vars.outputs.tag }}.bin
            release_assets/partitions-esp32c3-${{ steps.vars.outputs.tag }}.bin
            release_assets/bootloader-esp32c3-${{ steps.vars.outputs.tag }}.bin
            release_assets/firmware-esp32c3-merged-${{ steps.vars.outputs.tag }}.bin
            release_assets/firmware-esp32s3-${{ steps.vars.outputs.tag }}.bin
            release_assets/partitions-esp32s3-${{ steps.vars.outputs.tag }}.bin
            release_assets/bootloader-esp32s3-${{ steps.vars.outputs.tag }}.bin
            release_assets/firmware-esp32s3-merged-${{ steps.vars.outputs.tag }}.bin
            release_assets/firmware-esp32c5-${{ steps.vars.outputs.tag }}.bin
            release_assets/partitions-esp32c5-${{ steps.vars.outputs.tag }}.bin
            release_assets/bootloader-esp32c5-${{ steps.vars.outputs.tag }}.bin
            release_assets/firmware-esp32c5-merged-${{ steps.vars.outputs.tag }}.bin
            release_assets/boot_app0.bin
            release_assets/checksums.txt

      - name: Upload to Cloudflare R2 (Backup / Zero-Egress Primary)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          BIN_FILE="release_assets/firmware-esp32-${TAG}.bin"

          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "[R2] Uploading firmware binary to Cloudflare R2 bucket 'wifi-ota'..."
            pip install awscli
            aws s3 cp "$BIN_FILE" "s3://wifi-ota/firmware-esp32-${TAG}.bin" \
              --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
            echo "[R2] Successfully uploaded to Cloudflare R2!"
          else
            echo "[R2] Notice: Cloudflare R2 secrets not configured in repository. GitHub Releases will serve as primary download source."
          fi
