name: Build and Release ESP32 Firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version Tag (e.g. v0.9.0)"
        required: true
        default: "v0.9.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ESP32 Unified Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Clean version: ${TAG}"

      - name: Build Firmware with PlatformIO
        run: |
          cd firmware
          pio run -e esp32dev | tee ../pio_build.log
          cd ..

      - name: Package Firmware Assets & Generate Release Notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p release_assets
          cp firmware/.pio/build/esp32dev/firmware.bin release_assets/firmware-esp32-${TAG}.bin
          cp firmware/.pio/build/esp32dev/partitions.bin release_assets/partitions-esp32-${TAG}.bin
          cp firmware/.pio/build/esp32dev/bootloader.bin release_assets/bootloader-esp32-${TAG}.bin
          
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" 2>/dev/null | head -n 1)
          if [ -n "$BOOT_APP0" ] && [ -f "$BOOT_APP0" ]; then
            cp "$BOOT_APP0" release_assets/boot_app0.bin
          fi

          python3 -c "
          import os
          import re
          tag = '${TAG}'
          fw = open('release_assets/firmware-esp32-' + tag + '.bin', 'rb').read()
          pt = open('release_assets/partitions-esp32-' + tag + '.bin', 'rb').read()
          bl = open('release_assets/bootloader-esp32-' + tag + '.bin', 'rb').read()
          ba = open('release_assets/boot_app0.bin', 'rb').read() if os.path.exists('release_assets/boot_app0.bin') else b''
          buf = bytearray([0xFF] * (0x10000 + len(fw)))
          buf[0x1000:0x1000+len(bl)] = bl
          buf[0x8000:0x8000+len(pt)] = pt
          if ba:
              buf[0xe000:0xe000+len(ba)] = ba
          buf[0x10000:0x10000+len(fw)] = fw
          open('release_assets/firmware-esp32-merged-' + tag + '.bin', 'wb').write(buf)

          # Extract flash and RAM statistics
          fw_size = len(fw)
          partition_size = 1966080  # 1.9 MB OTA slot
          flash_pct = (fw_size / partition_size) * 100
          free_flash = partition_size - fw_size
          free_flash_pct = (free_flash / partition_size) * 100

          ram_str = 'N/A'
          flash_str = f'{fw_size:,} bytes ({flash_pct:.1f}% of {partition_size:,} bytes)'
          if os.path.exists('pio_build.log'):
              log = open('pio_build.log').read()
              ram_match = re.search(r'RAM:\s+\[[^\]]+\]\s+([\d\.]+%)\s+\(used\s+(\d+)\s+bytes\s+from\s+(\d+)\s+bytes\)', log)
              if ram_match:
                  ram_str = f'{int(ram_match.group(2)):,} bytes ({ram_match.group(1)} of {int(ram_match.group(3)):,} bytes)'
              flash_match = re.search(r'Flash:\s+\[[^\]]+\]\s+([\d\.]+%)\s+\(used\s+(\d+)\s+bytes\s+from\s+(\d+)\s+bytes\)', log)
              if flash_match:
                  flash_str = f'{int(flash_match.group(2)):,} bytes ({flash_match.group(1)} of {int(flash_match.group(3)):,} bytes)'

          # Extract changelog section for release documentation
          changelog_section = ''
          if os.path.exists('CHANGELOG.md'):
              clean_ver = tag.lstrip('v')
              content = open('CHANGELOG.md').read()
              m = re.search(r'## \[' + re.escape(clean_ver) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)', content, re.DOTALL)
              if m:
                  changelog_section = m.group(1).strip()

          body = f'''## Release {tag}

### ⚡ ESP32 Firmware Resource Utilization
| Metric | Utilization | Total Allocated | Free Space |
| :--- | :--- | :--- | :--- |
| **Flash (App Slot)** | **{flash_str}** | 1,966,080 bytes (1.9 MB OTA) | {free_flash:,} bytes ({free_flash_pct:.1f}%) |
| **DRAM (RAM)** | **{ram_str}** | 327,680 bytes (320 KB) | Dynamic Heap |

---

### 📖 Release Documentation & Highlights
{changelog_section if changelog_section else 'See [CHANGELOG.md](https://github.com/kreier/wifi/blob/main/CHANGELOG.md) for full release notes.'}

---

### 🚀 Installation & Flashing
- **In-Browser Web Flasher (Zero-install)**: [https://kreier.github.io/wifi](https://kreier.github.io/wifi)
- **Manual Flashing (esptool.py)**:
  ```bash
  esptool.py --chip esp32 --baud 921600 write_flash 0x0 firmware-esp32-merged-{tag}.bin
  ```
- **Firmware Binary (App only at 0x10000 or via OTA)**: `firmware-esp32-{tag}.bin`
- **Full Factory Image (Bootloader + Partitions + App at 0x0)**: `firmware-esp32-merged-{tag}.bin`
'''
          open('release_body.md', 'w').write(body)
          "

          cd release_assets
          sha256sum firmware-esp32-${TAG}.bin > checksums.txt
          sha256sum partitions-esp32-${TAG}.bin >> checksums.txt
          sha256sum bootloader-esp32-${TAG}.bin >> checksums.txt
          if [ -f boot_app0.bin ]; then sha256sum boot_app0.bin >> checksums.txt; fi
          if [ -f firmware-esp32-merged-${TAG}.bin ]; then sha256sum firmware-esp32-merged-${TAG}.bin >> checksums.txt; fi
          cat checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          body_path: release_body.md
          files: |
            release_assets/firmware-esp32-${{ steps.vars.outputs.tag }}.bin
            release_assets/partitions-esp32-${{ steps.vars.outputs.tag }}.bin
            release_assets/bootloader-esp32-${{ steps.vars.outputs.tag }}.bin
            release_assets/boot_app0.bin
            release_assets/firmware-esp32-merged-${{ steps.vars.outputs.tag }}.bin
            release_assets/checksums.txt

      - name: Upload to Cloudflare R2 (Backup / Zero-Egress Primary)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          BIN_FILE="release_assets/firmware-esp32-${TAG}.bin"

          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "[R2] Uploading firmware binary to Cloudflare R2 bucket 'wifi-ota'..."
            pip install awscli
            aws s3 cp "$BIN_FILE" "s3://wifi-ota/firmware-esp32-${TAG}.bin" \
              --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
            echo "[R2] Successfully uploaded to Cloudflare R2!"
          else
            echo "[R2] Notice: Cloudflare R2 secrets not configured in repository. GitHub Releases will serve as primary download source."
          fi
