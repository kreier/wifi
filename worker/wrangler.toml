name = "wifi"
main = "src/index.ts"
compatibility_date = "2024-05-01"
account_id = "545c9b44c3df46e24d2ae837aebfa7b6"
workers_dev = true

[vars]
ENVIRONMENT = "production"
STABLE_VERSION = "1.1.8"
CANARY_VERSION = ""
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "hcmue.edu.vn"

[observability.logs]
enabled = true
invocation_logs = true

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "wifi-mon-db"
database_id = "75f3f8a5-25d7-427f-a1a0-ea0be410e2f5"
migrations_dir = "migrations"

# Cloudflare R2 Bucket for Firmware OTA Storage (Enable on dash.cloudflare.com to activate)
# [[r2_buckets]]
# binding = "OTA_BUCKET"
# bucket_name = "wifi-ota"

# Cron trigger: Runs every day at 00:15 UTC for 30-day data rotation & daily summarization
[triggers]
crons = ["15 0 * * *"]
